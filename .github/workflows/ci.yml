name: CI
on:
  push: {branches: [main]}
  pull_request: {branches: [main]}
permissions: {contents: read}
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env: {POSTGRES_DB: osint, POSTGRES_USER: osint, POSTGRES_PASSWORD: ci-password}
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U osint -d osint" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    env:
      DATABASE_URL: postgresql+psycopg://osint:ci-password@localhost:5432/osint
      SECRET_KEY: ci-only-secret-key-that-is-at-least-32-characters
      ENVIRONMENT: testing
      REDIS_HOST: localhost
      RATE_LIMIT_BACKEND: redis
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip}
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt ruff mypy pip-audit bandit
      - run: python -m compileall -q backend tests
      - run: ruff check backend tests
      - run: bandit -q -r backend -x backend/app/integrations/file/yara_rules
      - run: alembic heads | tee /tmp/heads && test "$(wc -l < /tmp/heads)" -eq 1
      - run: alembic upgrade head
      - run: alembic current
      - run: python -m pytest -q
      - run: pip-audit --requirement requirements.txt
  frontend:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: frontend}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci
      - run: npm test -- --run
      - run: npm run build
      - run: npm audit --audit-level=high
  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose config
      - run: docker compose build
      - run: docker compose up -d
      - run: |
          for i in {1..30}; do curl -fsS http://localhost:8000/health && break; sleep 2; done
          curl -fsS http://localhost:8000/ready
      - run: docker compose ps
      - run: docker compose down -v
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: gitleaks/gitleaks-action@v2
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: '1'
